name: Setup
description: Install pnpm (version from "packageManager" in package.json), Node 24 and the locked dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
